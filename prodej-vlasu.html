  <dialog class="method-lightbox" aria-label="Zvětšená fotografie">
    <button class="lightbox-close" type="button" aria-label="Zavřít zvětšenou fotografii">×</button>
    <img class="lightbox-image" alt="">
  </dialog>
  <script>
    const lightbox = document.querySelector(".method-lightbox");
    const lightboxImage = lightbox.querySelector(".lightbox-image");
    let lightboxScrollPosition = { x: 0, y: 0 };
    let activeProductCard = null;

    document.querySelectorAll(".hair-photo-button").forEach((button) => {
      button.addEventListener("click", () => {
        const image = button.querySelector("img");
        activeProductCard = button.closest(".hair-product-card");
        lightboxScrollPosition = { x: window.scrollX, y: window.scrollY };
        lightboxImage.src = image.src;
        lightboxImage.alt = image.alt;
        lightbox.showModal();
        requestAnimationFrame(() => {
          window.scrollTo(lightboxScrollPosition.x, lightboxScrollPosition.y);
        });
      });
    });

    lightbox.addEventListener("close", () => {
      const productCard = activeProductCard;
      activeProductCard = null;
      requestAnimationFrame(() => {
        window.scrollTo(lightboxScrollPosition.x, lightboxScrollPosition.y);
        if (productCard?.matches(":hover")) {
          productCard.classList.add("suppress-hover");
          productCard.addEventListener("pointerleave", () => {
            productCard.classList.remove("suppress-hover");
          }, { once: true });
        }
      });
    });

    lightbox.querySelector(".lightbox-close").addEventListener("click", () => {
      lightbox.close();
    });

    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) {
        lightbox.close();
      }
    });
  </script>
